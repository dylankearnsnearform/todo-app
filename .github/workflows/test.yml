name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: unit + integration + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests (no browser)
        run: pytest -m "not e2e" --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  e2e:
    name: browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Run E2E (boots its own live server)
        run: pytest -m e2e --tracing=retain-on-failure --video=retain-on-failure --screenshot=only-on-failure
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore
