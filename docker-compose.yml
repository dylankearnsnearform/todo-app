# Orchestration for the Todo App (single hypermedia monolith + SQLite volume).
#
# There is no separate frontend or database container by design (AD-1/AD-2/AD-3):
# one FastAPI process renders HTML, and SQLite persists to the named `todo-data`
# volume.
#
#   Run the app (default / dev):  docker compose up --build      → http://localhost:8000
#   Logs:                         docker compose logs -f app
#   Run the tests (test profile): docker compose run --rm test
#
# The `app` service has no profile, so a bare `docker compose up` starts it (dev
# is the default environment). The `test` profile holds the in-container test
# runner. Environment comes from this file plus an optional `.env` (.env.example).

services:
  app:
    build:
      context: .
      target: runtime
    image: todo-app:latest
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # SQLite file lives on the mounted volume so data survives restarts (FR-9).
      DATABASE_URL: "sqlite:////data/todo.db"
      PORT: "8000"
    volumes:
      - todo-data:/data
    networks:
      - todo-net
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Runs unit + integration + api tests inside the image (no browser).
  # E2E stays on the host / a Playwright CI image (`make test-e2e`).
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: todo-app-test:latest
    environment:
      TEST_ENV: "local"
    networks:
      - todo-net

volumes:
  todo-data:

networks:
  todo-net:
    driver: bridge
